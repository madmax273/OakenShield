<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <script src="../utils/storage.js"></script>
    <script src="../core/stateManager.js"></script>
    <script src="../core/statsManager.js"></script>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="../assets/icon.png" class="brand-icon" alt="OakenShield Logo" />
        <h1>OakenShield</h1>
      </div>
      <div class="controls" style="display:flex; align-items:center; gap:8px;">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme" style="color: inherit;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </button>
        <label class="switch">
          <input type="checkbox" id="focusToggle" checked />
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-value" id="statBlocked">0</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat-box success">
        <div class="stat-value" id="statResisted">0</div>
        <div class="stat-label">Resisted</div>
      </div>
      <div class="stat-box warning">
        <div class="stat-value" id="statContinued">0</div>
        <div class="stat-label">Continued</div>
      </div>
    </div>

    <div class="actions">
      <button id="manageBtn" class="btn-primary">Manage Keywords</button>
      <button id="dashBtn" class="btn-secondary" style="margin-top: 8px;">View Chronicle</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
