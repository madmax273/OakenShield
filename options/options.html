<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css">
  <script src="../utils/storage.js"></script>
  <script src="../core/stateManager.js"></script>
</head>
<body>
  <div class="container">
    <header style="position: relative;">
        <!-- Close / Back Button -->
        <button id="closeBtn" class="icon-btn" title="Close Settings" style="position: absolute; left: 0; top: 0; background: transparent; border: none; font-size: 24px; cursor: pointer; color: inherit;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <!-- Theme Toggle -->
        <button id="themeToggle" class="icon-btn" title="Toggle Theme" style="position: absolute; right: 0; top: 0; background: transparent; border: none; cursor: pointer; color: inherit;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        </button>
        <div class="brand">
            <img src="../assets/icon.png" class="brand-icon" alt="OakenShield Logo" />
            <h1>OakenShield Settings</h1>
        </div>
        <p>Define the keywords that distract you. We'll intercept searches and URLs containing them.</p>
    </header>

    <div class="keyword-section">
        <h2>Banned Keywords</h2>
        
        <div class="add-keyword-bar">
            <input type="text" id="keywordInput" placeholder="e.g. twitter, netflix, cricket" />
            <button id="addKeywordBtn">Add Rule</button>
        </div>

        <ul class="keyword-list" id="keywordList">
            <!-- Keywords will be populated here -->
        </ul>
    </div>

    <div style="margin-top: 48px; text-align: center; color: #94a3b8; font-size: 13px;">
      <p style="margin: 0 0 4px 0;">Your data never leaves your browser.</p>
      <p style="margin: 0;">v1.0.0</p>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
